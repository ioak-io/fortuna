name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.3
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install root dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install package-example
      run: |
        cd packages/package-example
        poetry install --no-interaction

    - name: Install package-unit
      run: |
        cd packages/package-unit
        poetry install --no-interaction

    - name: Install service-example
      run: |
        cd services/service-example
        poetry install --no-interaction

    - name: Install service-unit
      run: |
        cd services/service-unit
        poetry install --no-interaction

    - name: Run ruff linting
      run: poetry run ruff check .

    - name: Run ruff formatting check
      run: poetry run ruff format --check .

    - name: Run mypy type checking
      run: poetry run mypy packages/ services/

    - name: Test package-example
      run: |
        cd packages/package-example
        poetry run pytest --cov=src/package_example --cov-report=xml

    - name: Test package-unit
      run: |
        cd packages/package-unit
        poetry run pytest --cov=src/package_unit --cov-report=xml

    - name: Test service-example
      run: |
        cd services/service-example
        poetry run pytest --cov=src/service_example --cov-report=xml

    - name: Test service-unit
      run: |
        cd services/service-unit
        poetry run pytest --cov=src/service_unit --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./packages/package-example/coverage.xml,./packages/package-unit/coverage.xml,./services/service-example/coverage.xml,./services/service-unit/coverage.xml
        fail_ci_if_error: true

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t axion-py:latest .

    - name: Test Docker image
      run: |
        docker run --rm -d -p 2110:2110 --name test-api axion-py:latest
        sleep 10
        curl -f http://localhost:2110/health || exit 1
        curl -f http://localhost:2110/compute?a=5&b=3 || exit 1
        docker stop test-api
