[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "axion-py"
version = "0.1.0"
description = "Axion monorepo with Poetry workspace management"
authors = ["Enterprise Team <team@company.com>"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
package-statement = { path = "packages/package-statement", develop = true }
middlewares = { path = "packages/middlewares", develop = true }
service-unit = { path = "services/service-unit", develop = true }
database = { path = "packages/database", develop = true }
package-qdrant = { path = "packages/package-qdrant", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
pre-commit = "^4.0.0"
black = "^24.8.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=packages/package-example/src",
    "--cov=services/service-example/src",
    "--cov=packages/package-statement/src",
    "--cov=packages/database/src",
    "--cov=services/service-unit/src",
    "--cov=services/service-agent/src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = [
    "packages/package-example/src",
    "services/service-example/src",
    "packages/package-statement/src",
    "packages/database/src",
    "services/service-unit/src",
    "services/service-agent/src"
]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
