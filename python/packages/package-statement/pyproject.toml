[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "package-statement"
version = "0.1.0"
description = "LLM utilities package"
authors = ["Enterprise Team <team@company.com>"]
readme = "README.md"
packages = [{include = "package_statement", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.0"
pydantic = "^2.9.0"
scikit-learn = "^1.7.2"
numpy = "^2.3.3"
langchain-text-splitters = "^0.3.11"
langchain-experimental = "^0.3.4"
langchain-core = "^0.3.78"
langchain-openai = "^0.3.35"
openai = "^2.2.0"
pdfplumber = "^0.11.7"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
xlrd = "^2.0.2"
package-qdrant = { path = "../package-qdrant", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "package_statement.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/package_statement",
    "--cov-report=term-missing",
]
