[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "middlewares"
version = "0.1.0"
description = "Python middlewares for Axion project"
authors = ["Enterprise Team <team@company.com>"]
readme = "README.md"
packages = [{include = "package_middlewares", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
PyJWT = "^2.8.0"
requests = "^2.32.0"
uvicorn = "^0.31.0"
python-multipart = "^0.0.9"
loguru = "^0.7.2"
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
