[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "database"
version = "0.1.0"
description = "Async PostgreSQL database utilities for Fortuna Python monorepo"
authors = ["Enterprise Team <team@company.com>"]
readme = "README.md"
packages = [{include = "package_database", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
psycopg = {version = "^3.2.1", extras = ["binary", "pool"]}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/package_database",
    "--cov-report=term-missing",
]
